# Plans as issues in this repository, shown in a GitHub Project. Reads plan.yaml
# from the code repository's personal-notes branch and never writes there.
name: GitHub-native plans (sandbox)

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
    inputs:
      steps:
        description: What to run
        type: choice
        options: [import-and-sync, sync-only]
        default: sync-only
      plans:
        description: Plan ids to import from the personal-notes branch
        default: rdr-core-engine rdr-engine-extensions rdr-expert-framework rdr-explanation rdr-interface-and-decorator
      refresh_bodies:
        description: Rewrite existing issues from plan.yaml (overwrites edits made on the issues)
        type: boolean
        default: false
      recreate_views:
        description: Delete every view and recreate the Plan and Plan board views (discards edits made to views)
        type: boolean
        default: false

concurrency:
  group: github-native-plans
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CODE_REPOSITORY: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
  PLANS: ${{ inputs.plans || 'rdr-core-engine rdr-engine-extensions rdr-expert-framework rdr-explanation rdr-interface-and-decorator' }}
  PROJECT_TITLE: CRAM plans (GitHub-native sandbox)

jobs:
  plans:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'github-native-sandbox')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPOSITORY }}
          ref: claude/personal-notes
          path: notes
          sparse-checkout: .claude/personal/plans
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Import plans into issues
        if: github.event_name == 'push' || inputs.steps == 'import-and-sync'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh_bodies && '--refresh-bodies' || '' }}
        run: python github_native_plans/import_plans.py --code-repository "$CODE_REPOSITORY" --plans-directory notes/.claude/personal/plans $PLANS $REFRESH
      - name: Sync the project from the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          RECREATE_VIEWS: ${{ inputs.recreate_views && '--recreate-views' || '' }}
          SESSION_ENVIRONMENT: ${{ vars.CLAUDE_ENVIRONMENT }}
        run: |
          if [ -z "$PROJECTS_TOKEN" ]; then
            echo "::error::Add the repository secret PROJECTS_TOKEN (a classic token with only the project scope) to sync the project."
            exit 1
          fi
          python github_native_plans/sync_project.py --project-title "$PROJECT_TITLE" --code-repository "$CODE_REPOSITORY" \
            ${SESSION_ENVIRONMENT:+--session-environment "$SESSION_ENVIRONMENT"} $RECREATE_VIEWS
