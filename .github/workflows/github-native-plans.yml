# Sandbox: plans as issues, shown in a GitHub Project. Lives only on the
# github-native-plans branch; nothing on main or the personal-notes branch changes.
name: GitHub-native plans (sandbox)

on:
  push:
    branches: [github-native-plans]
  workflow_dispatch:
    inputs:
      steps:
        description: What to run
        type: choice
        options: [import-and-sync, sync-only]
        default: sync-only
      plans:
        description: Plan ids to import from the personal-notes branch
        default: rdr-core-engine rdr-engine-extensions rdr-expert-framework rdr-explanation rdr-interface-and-decorator
      refresh_bodies:
        description: Rewrite existing issues from plan.yaml (overwrites edits made on the issues)
        type: boolean
        default: false

concurrency:
  group: github-native-plans
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  PLANS: ${{ inputs.plans || 'rdr-core-engine rdr-engine-extensions rdr-expert-framework rdr-explanation rdr-interface-and-decorator' }}
  PROJECT_TITLE: CRAM plans (GitHub-native sandbox)

jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/personal-notes
          path: notes
          sparse-checkout: .claude/personal/plans
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Import plans into issues
        if: inputs.steps != 'sync-only'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH: ${{ inputs.refresh_bodies && '--refresh-bodies' || '' }}
        run: python github_native_plans/import_plans.py --plans-directory notes/.claude/personal/plans $PLANS $REFRESH
      - name: Sync the project from the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          if [ -z "$PROJECTS_TOKEN" ]; then
            echo "::error::Add the repository secret PROJECTS_TOKEN (a classic token with only the project scope) to sync the project."
            exit 1
          fi
          python github_native_plans/sync_project.py --project-title "$PROJECT_TITLE"
